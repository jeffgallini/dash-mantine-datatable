api-reference:
  package: dash_mantine_datatable
  dir: reference
  title: Reference
  desc: "The Python API centers on the Dash DataTable component, small dictionary builders for common nested props, and fluent methods for updating table behavior in place."
  dynamic: false
  parser: numpy
  sections:
    - title: Component
      desc: Main generated Dash component.
      contents:
        - name: DataTable
          members: []
    - title: Helper Builders
      desc: Dictionary factories for readable table configuration.
      contents:
        - Column
        - ColumnGroup
        - SelectionConfig
        - PaginationConfig
        - RowExpansionConfig
